<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Information</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
    <div class="container nav">

        <span class="logo">Portfolio Generator</span>

        <nav>
            <a href="index.html">Home</a>
            <a href="manage.html">Manage Portfolio</a>
        </nav>

    </div>
</header>


<main class="page">
    <div class="container">

        <form id="portfolioForm" class="form-card">

            <h1>Portfolio Information</h1>
            <p>Enter your information below.</p>


            <!-- PERSONAL INFORMATION -->

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input id="fullName" required>
            </div>

            <div class="form-group">
                <label for="profilePicture">Profile Picture</label>
                <input type="file" id="profilePicture" accept="image/*">
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="tel" id="contactNumber">
                </div>

            </div>


            <div class="form-group">
                <label for="address">Address</label>
                <input id="address">
            </div>

            <div class="form-group">
                <label for="aboutMe">About Me</label>
                <textarea id="aboutMe"></textarea>
            </div>


            <!-- EDUCATION -->

            <h3>Education</h3>

            <div class="form-group">
                <label for="school">School</label>
                <input id="school">
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="course">Course / Program</label>
                    <input id="course">
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <input id="year">
                </div>

            </div>


            <!-- SKILLS -->

            <div class="form-group">
                <label for="skills">Skills</label>
                <input
                    id="skills"
                    placeholder="Example: HTML, CSS, JavaScript"
                >
            </div>


            <!-- PROJECT -->

            <h3>Project</h3>

            <div class="form-group">
                <label for="projectTitle">Project Title</label>
                <input id="projectTitle">
            </div>

            <div class="form-group">
                <label for="projectDescription">Description</label>
                <textarea id="projectDescription"></textarea>
            </div>

            <div class="form-group">
                <label for="projectLink">Project Link</label>
                <input type="url" id="projectLink">
            </div>


            <!-- WORK EXPERIENCE -->

            <h3>Work Experience</h3>

            <div class="form-group">
                <label for="organization">Company / Organization</label>
                <input id="organization">
            </div>

            <div class="form-group">
                <label for="position">Position</label>
                <input id="position">
            </div>

            <div class="form-group">
                <label for="experienceDescription">Description</label>
                <textarea id="experienceDescription"></textarea>
            </div>


            <!-- SOCIAL LINKS -->

            <h3>Social Media / Website Links</h3>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="url" id="website">
            </div>

            <div class="form-group">
                <label for="facebook">Facebook</label>
                <input type="url" id="facebook">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn</label>
                <input type="url" id="linkedin">
            </div>

            <div class="form-group">
                <label for="github">GitHub</label>
                <input type="url" id="github">
            </div>


            <button type="button" class="btn outline" id="cancelButton">
                Cancel
            </button>

            <button type="submit" class="btn">
                Save & Continue
            </button>

            <p class="message" id="portfolioMessage"></p>

        </form>

    </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/portfolio.js"></script>

</body>
</html>
